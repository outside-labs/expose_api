[project]
name = "expose-api"
version = "0.1.0"
description = "Standalone typed dataclass applications with native ASGI and generated JSON CRUD."
readme = "README.md"
authors = [
    { name = "ellainng", email = "299958882+ellainng@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
enforce-type = ["enforce-type==0.1.0"]
backpack = ["backpack-store[enforce-type] @ git+https://github.com/outside-labs/backpack.git@54f5a1e883fcc32f8d87cc553dc83dae0434300d"]

[project.urls]
Source = "https://github.com/outside-labs/expose_api"
Issues = "https://github.com/outside-labs/expose_api/issues"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
